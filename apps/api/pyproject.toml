[project]
name = "unproject-api"
version = "0.1.0"
description = "Stage [6]: serves artifacts and runs the bodies estimator live"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.10",
    # Already pulled in by uvicorn[standard] for the server side; named here
    # because the transport benchmark imports its client directly.
    "websockets>=13",
    "unproject-pipeline",
]

[project.optional-dependencies]
# Inference needs the estimator's extra. Without it the API still serves
# artifacts; only the live routes refuse.
multihmr = ["unproject-pipeline[multihmr]"]

[project.scripts]
unproject-api = "unproject_api.cli:main"
unproject-live-benchmark = "unproject_api.measure:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unproject_api"]
