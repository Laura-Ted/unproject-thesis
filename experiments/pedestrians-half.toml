# pedestrians at half resolution: the same content scaled to 960x540. The
# resolution factor of the RQ2 matrix, protocol v2 (ADR-0005 WP2).
#
#   ffmpeg -y -i datasets/pedestrians/clip.mp4 -vf "scale=960:540" \
#       -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -an \
#       datasets/pedestrians-half/clip.mp4
#
# Note what the model sees: it resizes the long edge to 768 whatever the
# source, so both this and the full-resolution clip reach it as a 768x432
# tensor (432 rows is a whole number of patches, so no padding). The factor tests decoding, resizing and the
# detail that survives, not the tensor size - which is why v1 found resolution
# barely mattered.
schema_version = 1
name = "pedestrians-half"
description = "pedestrians scaled to 960x540. Same content, half the pixels."
seed = 0

[ingest]
source_path = "../datasets/pedestrians-half/clip.mp4"
frame_stride = 1

