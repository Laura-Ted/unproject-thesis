# RETIRED 2026-09-15, before any campaign measurement: the campaign's suites
# are cpu-suite.toml (MOT16-09, geometries by the ingest) and people-suite.toml, on the
# two research datasets only. This file is kept as the record of the M4 pilot
# of 2026-09-15 (docs/notes/2026-09-15-adr0005-v2-pilot-on-m4.md); it is not
# run by the Makefile and is not in the evidence bundle.
#
# The CPU-only point of RQ1 (ADR-0006 §4.4): the same clip and policy as the
# matrix suite's 16:9 cells with the model held to the CPU, so the difference
# between this and the matrix on the same machine is what the accelerator is
# worth. Two cells, not eight: the aspect-ratio and resolution factors are
# properties of the model that the matrix already measures, and a CPU cell
# costs about ten times a GPU one.
#
# `device = "cpu"` is enforced by the driver and by each job: a job that
# finds `UNPROJECT_DEVICE` set to anything else refuses rather than runs.
# The summary records `cpu` on every cell.
schema_version = 2
name = "rq1-v2-pedestrians-cpu"
description = "Output mode at 1920x1080 on the CPU alone, one process per job."
protocol = "rq1rq2-v2"

warmup_frames = 5
measured_frames = 60
repetitions = 3
frame_selection = "spread"
order_seed = 20260917
device = "cpu"

[[cells]]
name = "pedestrians-skeleton"
experiment = "../../pedestrians.toml"
output = "skeleton"

[[cells]]
name = "pedestrians-mesh"
experiment = "../../pedestrians.toml"
output = "mesh"

[[pairs]]
a = "pedestrians-skeleton"
b = "pedestrians-mesh"
question = "output mode at 1920x1080, on the CPU"
