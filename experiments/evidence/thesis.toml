# The evidence bundle of the thesis. ADR-0005 WP7.
#
# Every result the thesis quotes, by kind and local path, with the exact command
# that produced it. `unproject evidence-bundle experiments/evidence/thesis.toml
# evidence/thesis` reads each one, refuses one that is not what it claims to
# be, copies only summaries, tables, figures and descriptors, and writes
# release.json with every hash. The bundle directory is versioned; the
# artifacts are not.
#
# Paths with <id> are filled in by the author after the final runs (WP4
# runbook: docs/notes/2026-09-15-adr0005-wp4-final-evidence.md; the whole
# sequence: docs/release.md). Until then every result is optional and the
# bundle records the absent ones; at release `optional = true` is deleted
# from each result that ran, so an absence is refused rather than recorded.
# `require_final` is what makes a result a thesis result: a final evaluation
# from a clean tree, a suite whose every job ran from one clean commit, a
# bodies run whose manifest records a clean tree.
schema_version = 1
name = "thesis"
description = "Unproject thesis evidence: RQ1/RQ2 under protocol v2, the live path, MuPoTS-3D under the Unproject protocol, the hypotheses, the filter."

# Inputs indexed by hash and never carried. The weights are pinned by digest
# in every config; the footage is CC0 and its provenance is in the experiment.
inputs = [
    "../../models/multihmr2.pt",
    "../../datasets/pedestrians/clip.mp4",
    "../../datasets/pedestrians-half/clip.mp4",
    "../../datasets/pedestrians-letterbox/clip.mp4",
    "../../datasets/pedestrians-letterbox-half/clip.mp4",
]

# The RQ1/RQ2 matrix on the protocol machine, A. `rq1rq2-v2` keeps its label
# because the figure generator reads it; the campaign root is machine A's
# (ADR-0006 §4.4).
[[results]]
kind = "benchmark-suite"
label = "rq1rq2-v2"
path = "../../artifacts/campaign/A/benchmark-v2/rq1rq2-v2-matrix"
command = "make bench-matrix MACHINE=A"
# Every job from one clean commit, or the build refuses the suite.
require_final = true
optional = true

# The campaign (ADR-0006): the same suites on every declared machine, one
# entry per machine and suite, so the bundle carries each machine's summary
# and raw jobs apart and `campaign.csv` is derived from them. Machines are
# added here as they are added to benchmarks/machines.toml.
#
# Run on 2026-09-15/16 (docs/notes/2026-09-16-campaign-report.md): A, D and
# the five C-* hosts below, every suite from commit 7e7ac5c (D from 16b2231,
# which adds its registry line and nothing else), validated with
# benchmarks/validate-campaign.py. Machine B (the Mac mini) was dropped by the
# author's decision and has no entry; the first C-rtx4070 run and the first
# launches of A and D are pilots under artifacts/pilots/, not here.
[[results]]
kind = "benchmark-suite"
label = "campaign-A-people"
path = "../../artifacts/campaign/A/benchmark-v2/rq2-v2-people"
command = "make bench-people MACHINE=A"
require_final = true
optional = true

[[results]]
kind = "benchmark-suite"
label = "campaign-A-cpu"
