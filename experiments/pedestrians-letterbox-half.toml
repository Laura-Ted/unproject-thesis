# pedestrians letterboxed to a square and scaled to half: 960x960. The fourth
# corner of the aspect x resolution square of the RQ2 matrix, protocol v2.
#
#   ffmpeg -y -i datasets/pedestrians/clip.mp4 \
#       -vf "pad=1920:1920:0:420:color=black,scale=960:960" \
#       -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -an \
#       datasets/pedestrians-letterbox-half/clip.mp4
#
# Reaches the model as the same 768x768 tensor as pedestrians-letterbox; see
# that file and pedestrians-half.toml for what each factor can and cannot
# change.
