# MOT16-08: a wide pedestrian shopping street from a fixed camera at eye level,
# about twenty-three people in frame at a time. The "high" level of the
# person-count factor (protocol v2 §4.2, ADR-0006). Same source, same style of
# shot and same camera height as MOT16-09, so the two differ in the count and
# little else.
#
# See experiments/mot16-09.toml for the benchmark, the recipe and the terms;
# this sequence is in the test split of the same archive:
#
#   unzip -q datasets/_download/MOT16.zip "test/MOT16-08/*" -d datasets/_download/mot16-extract
#   cp -R datasets/_download/mot16-extract/test/MOT16-08 datasets/mot16/MOT16-08
