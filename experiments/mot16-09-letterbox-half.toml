# MOT16-09 at half resolution and letterboxed: each 2x2 block averaged into
# one pixel, then black bands to a square (`geometry.downscale = 2`,
# `letterbox_square = true`), so the source is 960x960 and the model sees a
# 768x768 tensor, upsampled from a smaller source as protocol v2 §3.2 notes.
# The fourth corner of the matrix: half resolution, square tensor.
#
# Derived from the official archive by the ingest on every machine,
# identically; the digest below is the source directory's.
schema_version = 1
name = "mot16-09-letterbox-half"
description = "MOT16-09 downscaled 2x and padded to 960x960 by the ingest."
seed = 0

[ingest]
source_path = "../datasets/mot16/MOT16-09/img1"
# seqinfo.ini: frameRate=30, seqLength=525, 1920x1080.
image_fps = 30.0
frame_stride = 1

[ingest.geometry]
downscale = 2
letterbox_square = true

[provenance]
title = "MOT16-09 (MOTChallenge MOT16 benchmark, training split)"
author = "Milan, Leal-Taixé, Reid, Roth and Schindler (MOTChallenge)"
source_url = "https://motchallenge.net/data/MOT16/"
download_url = "https://motchallenge.net/data/MOT16.zip"
licence = "Publicly available for research with citation of the benchmark paper; no licence text published, not redistributed here"
acquired_on = 2026-09-15
original_sha256 = "b944a7ddf0fbce8742a238b9717658d26a8810ab8595e94ba7b0d9ffad3a291b"
original_bytes = 1954509127
derivation = "as mot16-09.toml; the ingest averages each 2x2 block of every frame into one pixel, then pads with 210 black rows above and below to 960x960"
expected_sha256 = "6b1238af32a4931ba848ac587d81ccffeabc77b7b418723424e9b3cf5dca4999"
