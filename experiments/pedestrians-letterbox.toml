# pedestrians letterboxed to a square: the same 1920x1080 content with 420
# black rows added above and below, 1920x1920. The aspect-ratio factor of the
# RQ2 matrix under protocol v2 (ADR-0005 WP2).
#
#   ffmpeg -y -i datasets/pedestrians/clip.mp4 \
#       -vf "pad=1920:1920:0:420:color=black" \
#       -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -an \
#       datasets/pedestrians-letterbox/clip.mp4
#
# Padding rather than cropping, which is what v1 did: a crop removes part of
# the scene and with it some of the people, so v1's square cells confounded
# aspect ratio with content. Here every person is in both cells. The apparent
# scale is unchanged as well: the model resizes the long edge to 768, and the
# long edge is 1920 in both, so a person covers the same pixels of the tensor
# - the tensor is 768x768 instead of 768x432, and the difference is the
# 336 padded rows, which is exactly the factor under test. No residual scale
# variation to declare.
schema_version = 1
name = "pedestrians-letterbox"
description = "pedestrians padded to 1920x1920. Same content and scale, square tensor."
seed = 0

[ingest]
source_path = "../datasets/pedestrians-letterbox/clip.mp4"
frame_stride = 1

